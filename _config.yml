# Dependencies
markdown: kramdown
#redcarpet:
#  extensions:     [strikethrough,smart,with_toc_data]
highlighter: rouge

# Permalinks
permalink: /posts/:title/

# User Configuration
title: "Alex Sikilinda"
tagline: "A programmer's journey"
description: "Shipping software, mostly with .NET"
url: https://sikilinda.com
baseurl: "/"
paginate: 5
excerpt_separator: "<br>"
gems:
  - jekyll-mentions
  - jemoji
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-paginate

plugins: [jekyll-paginate]

# Author Info
author:
  name: "Alex Sikilinda"
  url: "https://sikilinda.com"

# Social Integration
social:
  twitter: AlexSikilinda
  addthis_pubid: ra-56dcb98b76d5a726

# Comments — giscus, backed by GitHub Discussions.
# repo_id and category_id are generated at https://giscus.app once Discussions
# is enabled on the repo and the giscus app is installed. `category` must match
# the name of the discussion category you create there.
giscus:
  repo: "AlexSikilinda/alexsikilinda.github.io"
  repo_id: "MDEwOlJlcG9zaXRvcnkzNzMyNzA5MA=="
  category: "Comments"
  category_id: "DIC_kwDOAjmQ8s4DF9K4"
  mapping: "pathname"
  reactions: "1"
  theme: "https://sikilinda.com/public/css/giscus.css"

# Google Analytics Configuration
# Proxy response must be in JSON and should have the fields - ga:pagePath, ga:pageview
google_analytics:
  tracking_id: your_google_analytics_tracking_id
  super_proxy_url: your_super_proxy_url

# Github
github:
  repo: AlexSikilinda
  feedback: your_github_repo_issues_page_url

# Version Info
version: 0.0.5
